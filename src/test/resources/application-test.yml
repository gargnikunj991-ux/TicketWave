spring:
  datasource:
    url: jdbc:h2:mem:ticketwave_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# When running tests with the 'test' profile, Redisson can be mocked or pointed to an in-memory test runner
redisson:
  singleServerConfig:
    address: "redis://localhost:6379"
    connectTimeout: 1000
    timeout: 1000
