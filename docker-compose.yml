version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketwave-postgres
    restart: always
    environment:
      POSTGRES_DB: ticketwave_db
      POSTGRES_USER: ticketwave_user
      POSTGRES_PASSWORD: ticketwave_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketwave_user -d ticketwave_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketwave-redis
    restart: always
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
